<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="Create a payment link, split QOR between collaborators, and verify the checkout receipt on QoreChain Diana.">
  <title>QoreSplit · Payment links on QoreChain</title>
</head>
<body>
  <header class="top">
    <div class="shell top-inner">
      <a class="brand" href="#" aria-label="QoreSplit home"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span> Qore<span>Split</span></a>
      <nav aria-label="Workspace">
        <a href="#create" data-route="create">Create link</a>
        <a href="#withdraw" data-route="withdraw">Withdraw</a>
        <a href="#verify" data-route="verify">Verify receipt</a>
      </nav>
      <button id="wallet" type="button" class="secondary">Connect wallet</button>
    </div>
  </header>
  <main class="shell">
    <div class="network"><span></span> QoreChain Diana Testnet</div>
    <div id="content"></div>
    <p id="status" role="status" aria-live="polite" hidden></p>
  </main>
  <footer class="shell footer">
    <span>QoreSplit on Diana</span>
    <a href="https://dashboard.qorechain.io/faucet" target="_blank" rel="noreferrer">Testnet faucet</a>
    <a href="https://docs.qorechain.io/developer-guide/evm-window-reference/" target="_blank" rel="noreferrer">EVM window setup</a>
  </footer>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
